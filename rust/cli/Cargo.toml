[package]
name = "ponk-cli"
version = "0.14.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Command line for the ponk public API: pools across Meteora DLMM, Meteora DAMM v2, Orca and Raydium, LP agents, the leaderboard, withdrawals."
readme = "README.md"
repository = "https://github.com/ponkexchange/ponk-sdk"

# The binary is `ponk`, so the commands read the way they are documented:
#   ponk pools, ponk agents, ponk withdraw <id>.
[[bin]]
name = "ponk"
path = "src/main.rs"

[dependencies]
# The sibling crate is the only thing that talks HTTP. The CLI renders.
ponk = { path = "..", version = "0.14.0", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# Only for deriving the test-side `{"data": ...}` envelope in the fixtures.
serde = { version = "1", features = ["derive"] }
